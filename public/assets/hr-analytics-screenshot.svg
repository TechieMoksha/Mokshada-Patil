<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .font-hr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Dark Container -->
  <rect width="1100" height="520" fill="#090d16" />

  <!-- Content Group -->
  <g transform="translate(36, 32)" class="font-hr">
    <!-- Header with Briefcase -->
    <g transform="translate(0, 0)">
      <!-- Briefcase Icon -->
      <g transform="translate(0, 4) scale(1.1)">
        <rect x="2" y="6" width="28" height="18" rx="3" fill="#854d0e" stroke="#ca8a04" stroke-width="1.2" />
        <path d="M10 6 V3 A2 2 0 0 1 12 1 H20 A2 2 0 0 1 22 3 V6" fill="none" stroke="#ca8a04" stroke-width="1.5" />
        <line x1="2" y1="12" x2="30" y2="12" stroke="#451a03" stroke-width="1.5" />
        <rect x="13.5" y="10.5" width="5" height="4" rx="1" fill="#facc15" />
      </g>
      <text x="44" y="24" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.3">Employee Retention Prediction &amp; HR Dashboard</text>
      <text x="44" y="48" font-size="12.5" font-weight="400" fill="#94a3b8">Predict Stay/Leave, view Retention Score, Top Factors, HR Recommendations, Geo Mapping, and auto-save updates for Power BI.</text>
    </g>

    <!-- Main Card Container: Employee Details -->
    <g transform="translate(0, 80)">
      <rect width="1028" height="375" rx="10" fill="#131926" stroke="#1e293b" stroke-width="1" />

      <!-- Section Title -->
      <g transform="translate(24, 26)">
        <text x="0" y="8" font-size="15" fill="#f8fafc">📜</text>
        <text x="24" y="8" font-size="16" font-weight="700" fill="#f8fafc">Employee Details</text>
      </g>

      <!-- Row 1: Age | Job Role | Distance From Home -->
      <!-- Age Slider -->
      <g transform="translate(24, 55)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Age</text>
        <text x="145" y="14" font-size="11" font-weight="600" fill="#ef4444">40</text>
        <rect x="0" y="28" width="300" height="4" rx="2" fill="#334155" />
        <rect x="0" y="28" width="150" height="4" rx="2" fill="#ef4444" />
        <circle cx="150" cy="30" r="6" fill="#ef4444" />
      </g>
      <!-- Job Role Dropdown -->
      <g transform="translate(356, 55)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Job Role</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">Manager</text>
        <path d="M280 36 L285 41 L290 36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <!-- Distance From Home Slider -->
      <g transform="translate(688, 55)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Distance From Home (km)</text>
        <text x="145" y="14" font-size="11" font-weight="600" fill="#ef4444">23</text>
        <rect x="0" y="28" width="300" height="4" rx="2" fill="#334155" />
        <rect x="0" y="28" width="145" height="4" rx="2" fill="#ef4444" />
        <circle cx="145" cy="30" r="6" fill="#ef4444" />
      </g>

      <!-- Row 2: Monthly Income | Department | Employee State -->
      <!-- Monthly Income Number Input -->
      <g transform="translate(24, 125)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Monthly Income</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">25000</text>
        <text x="260" y="42" font-size="14" fill="#94a3b8">−</text>
        <text x="282" y="42" font-size="14" fill="#94a3b8">+</text>
      </g>
      <!-- Department Dropdown -->
      <g transform="translate(356, 125)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Department</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">Human Resources</text>
        <path d="M280 36 L285 41 L290 36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <!-- Employee State Dropdown -->
      <g transform="translate(688, 125)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Employee State</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">Delhi</text>
        <path d="M280 36 L285 41 L290 36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Row 3: Job Satisfaction | Gender -->
      <g transform="translate(24, 195)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Job Satisfaction (1=Low, 4=High)</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">2</text>
        <path d="M280 36 L285 41 L290 36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <g transform="translate(356, 195)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Gender</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">Male</text>
        <path d="M280 36 L285 41 L290 36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Row 4: OverTime | Business Travel -->
      <g transform="translate(24, 265)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">OverTime</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">Yes</text>
        <path d="M280 36 L285 41 L290 36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <g transform="translate(356, 265)">
        <text x="0" y="14" font-size="12" fill="#94a3b8">Business Travel</text>
        <rect x="0" y="20" width="300" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="43" font-size="13" fill="#ffffff">Non-Travel</text>
        <path d="M280 36 L285 41 L290 36" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
