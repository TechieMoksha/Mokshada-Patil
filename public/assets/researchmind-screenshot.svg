<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <style>
      .font-rm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="rmCardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="#f8fafc" />

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="580" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Sidebar Content -->
  <g transform="translate(18, 30)" class="font-rm">
    <!-- Brand -->
    <text x="0" y="0" font-size="19" font-weight="800" fill="#0f172a">ResearchMind <tspan fill="#6366f1">✦</tspan></text>
    <text x="0" y="20" font-size="11" fill="#64748b">AI-powered research studio</text>

    <!-- Appearance -->
    <text x="0" y="65" font-size="12" font-weight="700" fill="#1e293b">Appearance</text>
    <!-- Dark Mode Toggle -->
    <g transform="translate(0, 78)">
      <rect width="28" height="15" rx="7.5" fill="#cbd5e1" />
      <circle cx="8" cy="7.5" r="5.5" fill="#ffffff" />
      <text x="36" y="12" font-size="11" fill="#475569">Dark mode</text>
    </g>

    <!-- Your workspace -->
    <text x="0" y="130" font-size="12" font-weight="700" fill="#1e293b">Your workspace</text>
    <!-- Workspace Card -->
    <g transform="translate(0, 142)">
      <rect width="184" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="18" font-size="12" font-weight="700" fill="#0f172a">✦ Research Assistant</text>
      <text x="10" y="34" font-size="9.5" fill="#64748b">Turn a research question into a</text>
      <text x="10" y="47" font-size="9.5" fill="#64748b">structured report with web evidence</text>
      <text x="10" y="60" font-size="9.5" fill="#64748b">and an AI critique.</text>
    </g>

    <!-- Research pipeline -->
    <text x="0" y="235" font-size="12" font-weight="700" fill="#1e293b">Research pipeline</text>
    <!-- Step 1 -->
    <g transform="translate(0, 248)">
      <rect width="184" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <rect x="8" y="9" width="24" height="24" rx="5" fill="#f1f5f9" />
      <text x="16" y="25" font-size="11" fill="#6366f1">🔍</text>
      <text x="38" y="19" font-size="11" font-weight="600" fill="#1e293b">Search Agent</text>
      <text x="38" y="32" font-size="9" fill="#64748b">Find relevant web information</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(0, 298)">
      <rect width="184" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <rect x="8" y="9" width="24" height="24" rx="5" fill="#f1f5f9" />
      <text x="16" y="25" font-size="11" fill="#6366f1">📄</text>
      <text x="38" y="19" font-size="11" font-weight="600" fill="#1e293b">Reader</text>
      <text x="38" y="32" font-size="9" fill="#64748b">Extract useful page content</text>
    </g>
  </g>

  <!-- Main Center Work Area -->
  <g transform="translate(250, 32)" class="font-rm">
    <!-- Eyebrow -->
    <text x="0" y="0" font-size="11" font-weight="600" fill="#6366f1" letter-spacing="0.5">✦ INTELLIGENT RESEARCH WORKSPACE</text>
    <!-- Main Headline -->
    <text x="0" y="38" font-size="36" font-weight="800" fill="#0f172a">Ideas into <tspan fill="#6366f1">insights.</tspan></text>
    <!-- Subtitle -->
    <text x="0" y="66" font-size="12" fill="#64748b">Explore a topic, gather web evidence, generate a structured report, and review its limitations — all in one workspace.</text>

    <!-- Start your research header -->
    <text x="0" y="115" font-size="20" font-weight="800" fill="#0f172a">Start your research</text>
    <text x="0" y="136" font-size="12" fill="#64748b">What would you like to investigate today?</text>

    <!-- Dropdown Question -->
    <g transform="translate(0, 150)">
      <text x="0" y="12" font-size="11" fill="#64748b">Need inspiration? Choose an example</text>
      <rect x="0" y="20" width="480" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="42" font-size="12" fill="#334155">How is generative AI changing healthcare?</text>
      <path d="M460 34 L465 40 L470 34" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Topic Input Box -->
    <g transform="translate(0, 224)">
      <rect width="480" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="18" font-size="10.5" fill="#64748b">Research topic</text>
      <text x="12" y="45" font-size="13" fill="#1e293b">How is generative AI changing healthcare?</text>

      <!-- Generate Button -->
      <g transform="translate(10, 88)">
        <rect width="460" height="38" rx="6" fill="#ef4444" />
        <text x="230" y="24" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">✦ Generate research report</text>
      </g>
    </g>
  </g>

  <!-- Right Column "What you'll get" -->
  <g transform="translate(770, 120)" class="font-rm">
    <text x="0" y="0" font-size="19" font-weight="800" fill="#0f172a">What you'll get</text>

    <!-- Card 01 -->
    <g transform="translate(0, 16)" filter="url(#rmCardShadow)">
      <rect width="280" height="52" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="18" font-size="9" font-weight="700" fill="#6366f1">01</text>
      <text x="14" y="32" font-size="12" font-weight="700" fill="#0f172a">Web research</text>
      <text x="14" y="45" font-size="9.5" fill="#64748b">Relevant search results and source URLs.</text>
    </g>

    <!-- Card 02 -->
    <g transform="translate(0, 78)" filter="url(#rmCardShadow)">
      <rect width="280" height="52" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="18" font-size="9" font-weight="700" fill="#6366f1">02</text>
      <text x="14" y="32" font-size="12" font-weight="700" fill="#0f172a">Readable evidence</text>
      <text x="14" y="45" font-size="9.5" fill="#64748b">Useful text extracted from available webpages.</text>
    </g>

    <!-- Card 03 -->
    <g transform="translate(0, 140)" filter="url(#rmCardShadow)">
      <rect width="280" height="52" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="18" font-size="9" font-weight="700" fill="#6366f1">03</text>
      <text x="14" y="32" font-size="12" font-weight="700" fill="#0f172a">Structured report</text>
      <text x="14" y="45" font-size="9.5" fill="#64748b">Introduction, key findings, limitations and conclusion.</text>
    </g>

    <!-- Card 04 -->
    <g transform="translate(0, 202)" filter="url(#rmCardShadow)">
      <rect width="280" height="52" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="18" font-size="9" font-weight="700" fill="#6366f1">04</text>
      <text x="14" y="32" font-size="12" font-weight="700" fill="#0f172a">Critical review</text>
      <text x="14" y="45" font-size="9.5" fill="#64748b">An AI-generated assessment of report quality and support.</text>
    </g>
  </g>
</svg>
