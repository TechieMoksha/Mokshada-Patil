<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <style>
      .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <!-- Soft shadow for buttons and input -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="560" fill="#ffffff" />

  <!-- Left Sidebar Background -->
  <rect x="0" y="0" width="320" height="560" fill="#f8fafc" />
  <line x1="320" y1="0" x2="320" y2="560" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Right Header Actions -->
  <g class="font-base" fill="#64748b" transform="translate(1000, 22)">
    <text x="0" y="16" font-size="13" font-weight="500">Share</text>
    <!-- Star Icon -->
    <path d="M50 5 l2.5 5 5.5 0.8 -4 3.9 0.9 5.3 -4.9 -2.6 -4.9 2.6 0.9 -5.3 -4 -3.9 5.5 -0.8 z" fill="none" stroke="#64748b" stroke-width="1.3" />
    <!-- Edit Icon -->
    <path d="M72 16 l1.5 -4.5 7 -7 3 3 -7 7 -4.5 1.5 z" fill="none" stroke="#64748b" stroke-width="1.3" />
    <!-- GitHub Icon -->
    <path d="M102 12 c0 -3.3 -2.7 -6 -6 -6 c-3.3 0 -6 2.7 -6 6 c0 2.6 1.7 4.9 4.1 5.7 c0.3 0.1 0.4 -0.1 0.4 -0.3 v-1.1 c-1.7 0.4 -2 -0.8 -2 -0.8 c-0.3 -0.7 -0.7 -0.9 -0.7 -0.9 c-0.5 -0.4 0 -0.4 0 -0.4 c0.6 0 0.9 0.6 0.9 0.6 c0.5 0.9 1.4 0.6 1.7 0.5 c0.1 -0.4 0.2 -0.6 0.4 -0.8 c-1.3 -0.1 -2.7 -0.7 -2.7 -3 c0 -0.7 0.2 -1.2 0.6 -1.6 c-0.1 -0.2 -0.3 -0.8 0.1 -1.6 c0 0 0.5 -0.2 1.7 0.6 c0.5 -0.1 1 -0.2 1.6 -0.2 c0.6 0 1.1 0.1 1.6 0.2 c1.2 -0.8 1.7 -0.6 1.7 -0.6 c0.4 0.8 0.1 1.4 0.1 1.6 c0.4 0.4 0.6 0.9 0.6 1.6 c0 2.3 -1.4 2.8 -2.7 3 c0.2 0.2 0.4 0.6 0.4 1.1 v1.7 c0 0.2 0.1 0.4 0.4 0.3 c2.4 -0.8 4.1 -3.1 4.1 -5.7 z" fill="#64748b" />
    <!-- Three Dots Menu -->
    <circle cx="125" cy="8" r="1.5" fill="#64748b" />
    <circle cx="125" cy="13" r="1.5" fill="#64748b" />
    <circle cx="125" cy="18" r="1.5" fill="#64748b" />
  </g>

  <!-- Sidebar Content -->
  <!-- Satellite Icon & Title -->
  <g transform="translate(24, 48)">
    <!-- Satellite Icon SVG -->
    <g transform="translate(0, 4) scale(0.9)">
      <path d="M4 18 A14 14 0 0 1 18 4" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
      <path d="M4 13 A9 9 0 0 1 13 4" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
      <circle cx="5" cy="19" r="2.5" fill="#6366f1" />
      <path d="M5 19 L15 9" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="32" y="22" class="font-base" font-size="20" font-weight="700" fill="#1e293b">Telecom Support</text>
    <text x="0" y="48" class="font-base" font-size="12" font-weight="400" fill="#64748b">Powered by RAG · Qwen3-32B on Groq</text>

    <!-- Divider Line -->
    <line x1="0" y1="70" x2="272" y2="70" stroke="#e2e8f0" stroke-width="1" />

    <!-- Sample questions Header -->
    <text x="0" y="105" class="font-base" font-size="14" font-weight="600" fill="#1e293b">Sample questions</text>
    <text x="0" y="128" class="font-base" font-size="12" font-weight="400" fill="#64748b">Click one to send it instantly.</text>

    <!-- Sample Question Button 1 -->
    <g transform="translate(0, 146)" filter="url(#card-shadow)">
      <rect width="272" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="26" class="font-base" font-size="12" font-weight="500" fill="#334155">Why is my mobile internet so slow?</text>
    </g>

    <!-- Sample Question Button 2 -->
    <g transform="translate(0, 200)" filter="url(#card-shadow)">
      <rect width="272" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="23" class="font-base" font-size="12" font-weight="500" fill="#334155">My calls keep dropping — what should I</text>
      <text x="14" y="40" class="font-base" font-size="12" font-weight="500" fill="#334155">do?</text>
    </g>
  </g>

  <!-- Main Hero Area -->
  <g class="font-base" transform="translate(370, 175)">
    <!-- Main Headline -->
    <text x="0" y="0" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Customer Care Assistant</text>
    <!-- Subtitle -->
    <text x="0" y="38" font-size="14.5" font-weight="400" fill="#64748b">Ask me anything about your mobile service — connectivity, billing, SIM, roaming, and more.</text>
  </g>

  <!-- Bottom Input Bar -->
  <g class="font-base" transform="translate(370, 395)">
    <rect width="760" height="56" rx="12" fill="#f1f5f9" />
    <text x="24" y="34" font-size="14" fill="#94a3b8">Describe your issue...</text>

    <!-- Submit Action Button -->
    <g transform="translate(712, 11)">
      <rect width="34" height="34" rx="8" fill="#e2e8f0" />
      <!-- Arrow Up Icon -->
      <path d="M17 23 L17 11 M12 16 L17 11 L22 16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom Right "Manage app" Pill -->
  <g class="font-base" transform="translate(1040, 498)">
    <rect width="132" height="36" rx="8" fill="#0f172a" />
    <!-- Chevron Left -->
    <path d="M22 18 L16 13 L22 8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 5)" />
    <text x="32" y="23" font-size="12.5" font-weight="500" fill="#ffffff">Manage app</text>
  </g>
</svg>
