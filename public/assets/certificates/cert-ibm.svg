<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <style>
      .font-serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Paper -->
  <rect width="900" height="640" fill="#fcfcfc" />

  <!-- Double Border Frame -->
  <rect x="25" y="25" width="850" height="590" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="35" y="35" width="830" height="570" fill="none" stroke="#cbd5e1" stroke-width="0.8" />
  <!-- Corner Ornaments -->
  <rect x="21" y="21" width="8" height="8" fill="#94a3b8" />
  <rect x="871" y="21" width="8" height="8" fill="#94a3b8" />
  <rect x="21" y="611" width="8" height="8" fill="#94a3b8" />
  <rect x="871" y="611" width="8" height="8" fill="#94a3b8" />

  <!-- Coursera Right Ribbon Banner -->
  <g transform="translate(600, 25)">
    <path d="M0 0 H200 V400 L100 470 L0 400 Z" fill="#e2e8f0" opacity="0.65" />
    <text x="100" y="75" class="font-sans" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="2">COURSE</text>
    <text x="100" y="98" class="font-sans" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="2">CERTIFICATE</text>

    <!-- Circular Seal -->
    <g transform="translate(100, 290)">
      <circle cx="0" cy="0" r="80" fill="none" stroke="#475569" stroke-width="2" />
      <circle cx="0" cy="0" r="74" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
      <circle cx="0" cy="0" r="54" fill="none" stroke="#475569" stroke-width="1.2" />
      <text x="0" y="8" class="font-sans" font-size="20" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="-0.5">coursera</text>
      <!-- Circular Text Mock -->
      <path id="circlePath" d="M -60 0 A 60 60 0 1 1 60 0" fill="none" />
      <text font-size="7.5" fill="#475569" letter-spacing="2" class="font-sans">
        <textPath href="#circlePath" startOffset="50%" text-anchor="middle">EDUCATION FOR EVERYONE</textPath>
      </text>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(90, 80)">
    <!-- IBM Striped Logo -->
    <g transform="translate(0, 5) scale(1.15)">
      <!-- 8-bar IBM style -->
      <g fill="#1d4ed8">
        <rect x="0" y="0" width="22" height="4" />
        <rect x="0" y="6" width="22" height="4" />
        <rect x="0" y="12" width="22" height="4" />
        <rect x="0" y="18" width="22" height="4" />
        <rect x="0" y="24" width="22" height="4" />
        <rect x="0" y="30" width="22" height="4" />
        <rect x="0" y="36" width="22" height="4" />
        <rect x="0" y="42" width="22" height="4" />

        <rect x="30" y="0" width="34" height="4" />
        <rect x="30" y="6" width="34" height="4" />
        <rect x="30" y="12" width="34" height="4" />
        <rect x="30" y="18" width="34" height="4" />
        <rect x="30" y="24" width="34" height="4" />
        <rect x="30" y="30" width="34" height="4" />
        <rect x="30" y="36" width="34" height="4" />
        <rect x="30" y="42" width="34" height="4" />

        <rect x="72" y="0" width="46" height="4" />
        <rect x="72" y="6" width="46" height="4" />
        <rect x="72" y="12" width="46" height="4" />
        <rect x="72" y="18" width="46" height="4" />
        <rect x="72" y="24" width="46" height="4" />
        <rect x="72" y="30" width="46" height="4" />
        <rect x="72" y="36" width="46" height="4" />
        <rect x="72" y="42" width="46" height="4" />
      </g>
    </g>

    <!-- Issue Date -->
    <text x="0" y="112" class="font-sans" font-size="11" fill="#64748b">Nov 28, 2025</text>

    <!-- Student Name -->
    <text x="0" y="170" class="font-serif" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="1">Mokshada Patil</text>

    <!-- Text Body -->
    <text x="0" y="210" class="font-sans" font-size="13" fill="#64748b">has successfully completed</text>
    <text x="0" y="248" class="font-serif" font-size="23" font-weight="700" fill="#1e293b">Introduction to Data Analytics</text>
    <text x="0" y="284" class="font-sans" font-size="12" fill="#64748b">an online non-credit course authorized by IBM and offered through Coursera</text>

    <!-- Signature -->
    <g transform="translate(0, 395)">
      <path d="M10 25 Q35 5 50 20 Q70 35 90 15 Q110 5 130 18 Q150 30 180 15" fill="none" stroke="#1e293b" stroke-width="1.8" />
      <path d="M80 10 L110 32 M120 12 L140 30" stroke="#1e293b" stroke-width="1.4" />
      <line x1="0" y1="42" x2="220" y2="42" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2" />
      <text x="0" y="58" class="font-sans" font-size="10.5" font-weight="600" fill="#334155">Rav Ahuja</text>
      <text x="0" y="72" class="font-sans" font-size="9" fill="#64748b">Global Program Director,</text>
      <text x="0" y="85" class="font-sans" font-size="9" fill="#64748b">Skills Network</text>
    </g>
  </g>

  <!-- Footer Verification -->
  <g transform="translate(680, 560)" class="font-sans">
    <text x="120" y="0" font-size="9" fill="#64748b" text-anchor="end">Verify at:</text>
    <text x="120" y="14" font-size="9" fill="#2563eb" text-anchor="end" text-decoration="underline">https://coursera.org/verify/NH7QLY62AD0Z</text>
    <text x="120" y="28" font-size="7.5" fill="#94a3b8" text-anchor="end">Coursera has confirmed the identity of this individual</text>
  </g>
</svg>
