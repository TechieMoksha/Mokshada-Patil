<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="100%" height="100%">
  <defs>
    <style>
      .font-cyber { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif; }
      .font-name { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    </style>
  </defs>

  <!-- Background Soft Green Matrix -->
  <rect width="920" height="640" fill="#f2f8f3" stroke="#b45309" stroke-width="6" />

  <!-- Matrix Background Digits Pattern -->
  <g opacity="0.12" fill="#15803d" font-family="monospace" font-size="11">
    <text x="25" y="50">010101010110101010101010101010101010101010101010101010101010101010101010101010101010101010101010101</text>
    <text x="25" y="90">110100101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101</text>
    <text x="25" y="130">001010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101</text>
    <text x="25" y="170">101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101</text>
    <text x="25" y="210">0101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101</text>
    <text x="25" y="250">111000101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101</text>
    <text x="25" y="290">0101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101010101</text>
  </g>

  <!-- Ornate Golden Corners -->
  <g fill="none" stroke="#d97706" stroke-width="2" opacity="0.85">
    <!-- Top-Left -->
    <path d="M15 80 L15 15 L80 15 M25 25 Q 50 15 70 25 Q 25 50 25 70" />
    <circle cx="45" cy="45" r="14" stroke="#b45309" />
    <!-- Top-Right -->
    <path d="M905 80 L905 15 L840 15 M895 25 Q 870 15 850 25 Q 895 50 895 70" />
    <circle cx="875" cy="45" r="14" stroke="#b45309" />
    <!-- Bottom-Left -->
    <path d="M15 560 L15 625 L80 625 M25 615 Q 50 625 70 615 Q 25 590 25 570" />
    <circle cx="45" cy="595" r="14" stroke="#b45309" />
    <!-- Bottom-Right -->
    <path d="M905 560 L905 625 L840 625 M895 615 Q 870 625 850 615 Q 895 590 895 570" />
    <circle cx="875" cy="595" r="14" stroke="#b45309" />
  </g>

  <!-- Content -->
  <g class="font-cyber">
    <!-- Raisoni Group Top Left -->
    <g transform="translate(65, 45)">
      <!-- Spiral Sun Logo -->
      <circle cx="35" cy="35" r="26" fill="#ea580c" />
      <path d="M35 15 A20 20 0 1 0 55 35 A15 15 0 1 0 35 25 A10 10 0 1 0 45 35" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <text x="35" y="75" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">RAISONI GROUP</text>
      <text x="35" y="88" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">a vision beyond</text>
    </g>

    <!-- Center Globe Shield -->
    <g transform="translate(460, 110)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#0284c7" stroke-width="3" />
      <ellipse cx="0" cy="0" rx="42" ry="18" fill="none" stroke="#0284c7" stroke-width="2" />
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#0284c7" stroke-width="2" />
    </g>

    <!-- Cyber Sanskar Top Right -->
    <g transform="translate(730, 45)">
      <text x="35" y="30" font-size="20" font-weight="900" fill="#0369a1" text-anchor="middle">CYBER</text>
      <text x="35" y="52" font-size="22" font-weight="900" fill="#dc2626" text-anchor="middle">संस्कार</text>
      <text x="35" y="72" font-size="8" font-weight="600" fill="#334155" text-anchor="middle">aware · educate · secure</text>
    </g>

    <!-- Main Title -->
    <text x="460" y="200" font-size="26" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">CERTIFICATE OF ATTENDANCE</text>
    <text x="460" y="235" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">THIS CERTIFICATE IS PROUDLY PRESENTED TO</text>

    <!-- Student Name -->
    <text x="460" y="285" class="font-name" font-size="32" font-weight="700" fill="#7e22ce" text-anchor="middle">Mokshada Patil</text>

    <!-- Description -->
    <text x="460" y="325" font-size="12" fill="#334155" text-anchor="middle">In recognition of his/her attendance at the <tspan font-weight="700">"Cyber Forensics Practices"</tspan> one-week <tspan font-weight="700">Student Development Program</tspan></text>
    <text x="460" y="348" font-size="12" fill="#334155" text-anchor="middle">(Hands-On Practical Training) in classroom mode from August 21 to 25, 2023. It is organized in collaboration with</text>
    <text x="460" y="371" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="700">Cyber Sanskar</tspan> by the Department of CSE - IT at the <tspan font-weight="700">G H Raisoni Institute of Engineering &amp; Business</tspan></text>
    <text x="460" y="394" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="700">Management, Jalgaon.</tspan> Certificate ID: R000114</text>

    <!-- Bottom QR and 4 Signatures -->
    <!-- QR Code -->
    <g transform="translate(75, 470)">
      <rect width="65" height="65" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
      <rect x="6" y="6" width="18" height="18" fill="#0f172a" />
      <rect x="41" y="6" width="18" height="18" fill="#0f172a" />
      <rect x="6" y="41" width="18" height="18" fill="#0f172a" />
      <text x="32" y="80" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">SCAN ME</text>
    </g>

    <!-- Sig 1: Dean Academics -->
    <g transform="translate(230, 480)">
      <path d="M5 25 Q30 5 45 25 Q60 40 85 15" fill="none" stroke="#dc2626" stroke-width="1.8" />
      <text x="50" y="45" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Dr. Sanjay Shekhawat</text>
      <text x="50" y="58" font-size="9" fill="#475569" text-anchor="middle">Dean Academics</text>
    </g>

    <!-- Sig 2: Director -->
    <g transform="translate(390, 480)">
      <path d="M5 25 Q25 10 40 25 Q55 35 75 10" fill="none" stroke="#0284c7" stroke-width="1.8" />
      <text x="45" y="45" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Dr. Preeti Agarwal</text>
      <text x="45" y="58" font-size="9" fill="#475569" text-anchor="middle">Director</text>
    </g>

    <!-- Sig 3: HOD CSE-IT -->
    <g transform="translate(560, 480)">
      <path d="M10 25 Q25 5 45 30 Q65 10 85 20" fill="none" stroke="#1e293b" stroke-width="1.8" />
      <text x="50" y="45" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Dr. Sonal Patil</text>
      <text x="50" y="58" font-size="9" fill="#475569" text-anchor="middle">Head of CSE-IT Dept.</text>
    </g>

    <!-- Sig 4: Cyber Sanskar -->
    <g transform="translate(730, 480)">
      <text x="50" y="20" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-style="italic">TSDikshit</text>
      <text x="50" y="45" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Dr. Tanmay S Dikshit</text>
      <text x="50" y="58" font-size="9" fill="#475569" text-anchor="middle">Cyber Sanskar, Nashik</text>
    </g>
  </g>
</svg>
