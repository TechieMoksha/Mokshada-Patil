<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background White Canvas with Thin Border -->
  <rect width="900" height="640" fill="#ffffff" stroke="#0f172a" stroke-width="12" />

  <!-- Subtle Pattern Background -->
  <g opacity="0.04" stroke="#0f172a" stroke-width="1">
    <circle cx="450" cy="320" r="160" fill="none" />
    <circle cx="450" cy="320" r="220" fill="none" />
    <circle cx="450" cy="320" r="280" fill="none" />
    <circle cx="450" cy="320" r="340" fill="none" />
  </g>

  <!-- Red Curved Ribbon Waves -->
  <path d="M0 160 Q 250 250 450 170 Q 650 90 900 170 L900 120 Q 650 50 450 130 Q 250 200 0 120 Z" fill="#dc2626" />
  <path d="M0 170 Q 250 260 450 180 Q 650 100 900 180 L900 160 Q 650 80 450 160 Q 250 240 0 150 Z" fill="#991b1b" opacity="0.4" />

  <!-- Content -->
  <g class="font-sans">
    <!-- Top Left Logo: FutureSkills Prime -->
    <g transform="translate(50, 40)">
      <text x="0" y="24" font-size="24" font-weight="800" fill="#0284c7">futureskills<tspan fill="#f97316">®</tspan></text>
      <text x="24" y="44" font-size="16" font-weight="700" fill="#ea580c">prime</text>
      <text x="0" y="58" font-size="8" fill="#475569">A MeitY - nasscom Digital Skilling Initiative</text>
    </g>

    <!-- Top Right Logo: Nasscom -->
    <g transform="translate(730, 45)">
      <text x="0" y="24" font-size="26" font-weight="800" fill="#991b1b" letter-spacing="-0.5">nasscom</text>
      <text x="14" y="42" font-size="14" font-weight="700" fill="#991b1b">IT-ITeS SSC</text>
    </g>

    <!-- Certificate of Participation -->
    <text x="450" y="145" font-size="30" font-weight="800" fill="#0284c7" text-anchor="middle">Certificate of Participation</text>

    <!-- Gold Course Participation Medallion Seal -->
    <g transform="translate(450, 240)">
      <circle cx="0" cy="0" r="48" fill="#fef08a" stroke="#ca8a04" stroke-width="2.5" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,3" />
      <polygon points="0,-24 4,-12 16,-12 6,-4 10,8 0,1 -10,8 -6,-4 -16,-12 -4,-12" fill="#ca8a04" />
      <text x="0" y="4" font-size="8" font-weight="800" fill="#854d0e" text-anchor="middle">COURSE</text>
      <text x="0" y="15" font-size="8" font-weight="800" fill="#854d0e" text-anchor="middle">PARTICIPATION</text>
      <text x="0" y="27" font-size="6" font-weight="700" fill="#ca8a04" text-anchor="middle">futureskills</text>
    </g>

    <!-- Student Name -->
    <text x="450" y="350" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">MOKSHADA PRAVIN PATIL</text>
    <line x1="300" y1="365" x2="600" y2="365" stroke="#0f172a" stroke-width="1.5" />

    <text x="450" y="390" font-size="15" fill="#334155" text-anchor="middle">has completed</text>

    <!-- Course Title -->
    <text x="450" y="425" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle">Gen AI Tools</text>
    <line x1="100" y1="440" x2="800" y2="440" stroke="#94a3b8" stroke-width="1" />

    <!-- Description -->
    <text x="450" y="468" font-size="14.5" fill="#334155" text-anchor="middle">Aligned to Competency Standards developed by IT-ITeS Sector Skills Council</text>
    <text x="450" y="492" font-size="14.5" fill="#334155" text-anchor="middle">Nasscom in collaboration with Industry and Government.</text>

    <!-- QR Code Right -->
    <g transform="translate(790, 290)">
      <rect width="68" height="68" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <rect x="5" y="5" width="20" height="20" fill="#0f172a" />
      <rect x="9" y="9" width="12" height="12" fill="#ffffff" />
      <rect x="12" y="12" width="6" height="6" fill="#0f172a" />

      <rect x="43" y="5" width="20" height="20" fill="#0f172a" />
      <rect x="47" y="9" width="12" height="12" fill="#ffffff" />
      <rect x="50" y="12" width="6" height="6" fill="#0f172a" />

      <rect x="5" y="43" width="20" height="20" fill="#0f172a" />
      <rect x="9" y="47" width="12" height="12" fill="#ffffff" />
      <rect x="12" y="50" width="6" height="6" fill="#0f172a" />
    </g>
    <text x="760" y="375" font-size="10" fill="#64748b" text-anchor="middle">Certificate ID: 26020549915</text>

    <!-- Date of Issue -->
    <g transform="translate(70, 545)">
      <text x="45" y="0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">02/05/2026</text>
      <line x1="0" y1="8" x2="110" y2="8" stroke="#0f172a" stroke-width="1.2" />
      <text x="45" y="25" font-size="12" fill="#475569" text-anchor="middle">Date of Issue</text>
    </g>

    <!-- Signature -->
    <g transform="translate(680, 510)">
      <path d="M50 30 Q70 5 90 25 Q110 50 130 15 Q140 25 150 10" fill="none" stroke="#1e3a8a" stroke-width="2" />
      <line x1="0" y1="42" x2="170" y2="42" stroke="#0f172a" stroke-width="1.2" />
      <text x="85" y="58" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dr. Abhilasha Gaur</text>
      <text x="85" y="73" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">CEO</text>
      <text x="85" y="88" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">IT-ITeS SSC Nasscom</text>
    </g>
  </g>
</svg>
